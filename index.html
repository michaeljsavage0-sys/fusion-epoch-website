<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Fusion Epoch: human-designed, AI-assisted decision support and learning decision support systems.">
<title>Fusion Epoch</title>
<link rel="preload" as="image" href="master_visual.jpg">
<style>
:root{--bg:#06285c;--cyan:#35c4ff;--panel:#061a36;--line:#2f6fa6;--text:#fff;--muted:#e6f3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.stage{position:relative;max-width:1536px;margin:0 auto;background:var(--bg)}
.stage img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:5;border-radius:10px;background:transparent;border:2px solid transparent;cursor:pointer;text-decoration:none;padding:0}
.hotspot:hover{border-color:rgba(53,196,255,.58);background:rgba(53,196,255,.035)}
.hotspot:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* Four application cards */
.cpr{left:15.0%;top:42.5%;width:19.6%;height:34.5%}
.water{left:35.7%;top:42.5%;width:18.9%;height:34.5%}
.atmos{left:55.9%;top:42.5%;width:19.6%;height:34.5%}
.exec{left:76.8%;top:42.5%;width:20.1%;height:34.5%}

/* Two horizontal information tabs above the cards */
.about-btn{left:17.25%;top:29.4%;width:17.0%;height:5.4%}
.gateway-btn{left:35.35%;top:29.4%;width:17.9%;height:5.4%}

/* Left navigation rail */
.nav-home{left:0;top:5.0%;width:12.6%;height:6.5%}
.nav-suite{left:0;top:11.7%;width:12.6%;height:7.0%}
.nav-about{left:0;top:19.0%;width:12.6%;height:7.7%}
.nav-gateway{left:0;top:26.9%;width:12.6%;height:7.9%}
.nav-news{left:0;top:34.9%;width:12.6%;height:7.6%}
.nav-docs{left:0;top:42.8%;width:12.6%;height:7.5%}
.nav-support{left:0;top:50.3%;width:12.6%;height:5.8%}
.nav-contact{left:0;top:56.2%;width:12.6%;height:6.5%}

.home-confirm{position:absolute;left:13.4%;top:.8%;width:86%;height:39%;z-index:4;border:3px solid rgba(53,196,255,0);border-radius:18px;pointer-events:none;transition:border-color .18s ease,box-shadow .18s ease}
.home-confirm.on{border-color:rgba(53,196,255,.72);box-shadow:0 0 24px rgba(53,196,255,.28)}

dialog{width:min(650px,calc(100vw - 32px));max-height:86vh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:#fff;box-shadow:0 24px 80px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(0,10,25,.72)}
.dialog-head{padding:18px 22px 8px}
.dialog-head h2{margin:0;font-size:1.45rem}
.dialog-body{padding:6px 22px 18px;line-height:1.55;color:var(--muted)}
.dialog-actions{display:flex;justify-content:flex-end;padding:0 22px 20px}
.close-btn{border:1px solid #4cbef1;background:#083d6b;color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}
.status{color:#68d8ff;font-weight:700}
.contact-link{color:#7ee8ff;text-decoration:none;border-bottom:1px solid rgba(126,232,255,.45)}
.contact-link:hover,.contact-link:focus{border-bottom-color:#7ee8ff}

@media(max-width:760px){
  .stage{overflow-x:auto}
  .stage img{min-width:980px}
  .hotspot,.home-confirm{min-width:0}
  dialog{width:min(650px,calc(100vw - 20px))}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" aria-label="Fusion Epoch landing page" id="home">
  <img src="master_visual.jpg" fetchpriority="high" decoding="async" alt="Fusion Epoch home page showing four decision support and learning decision support systems">
  <div id="homeConfirm" class="home-confirm" aria-hidden="true"></div>

  <a class="hotspot cpr" href="#cpr-gf" data-info="cpr" aria-label="CPR GF DSS Pre-Review information"></a>
  <a class="hotspot water" href="#open-water" data-info="water" aria-label="Open Water information"></a>
  <a class="hotspot atmos" href="#atmospheric-science" data-info="atmos" aria-label="Atmospheric Science LDSS information"></a>
  <a class="hotspot exec" href="#eexecutor" data-info="exec" aria-label="eExecutor.ai DSS information"></a>

  <a class="hotspot about-btn" href="#about" data-info="about" aria-label="About Fusion Epoch"></a>
  <a class="hotspot gateway-btn" href="#gateway" data-info="gateway" aria-label="DSS Access Gateway"></a>

  <a class="hotspot nav-home" href="#home" data-action="home" aria-label="Home"></a>
  <a class="hotspot nav-suite" href="#suite" data-info="suite" aria-label="DSS and LDSS suite"></a>
  <a class="hotspot nav-about" href="#about" data-info="about" aria-label="About Fusion Epoch"></a>
  <a class="hotspot nav-gateway" href="#gateway" data-info="gateway" aria-label="DSS Access Gateway"></a>
  <a class="hotspot nav-news" href="#news" data-info="news" aria-label="News and Updates"></a>
  <a class="hotspot nav-docs" href="#documentation" data-info="docs" aria-label="Documentation"></a>
  <a class="hotspot nav-support" href="#support" data-info="support" aria-label="Support"></a>
  <a class="hotspot nav-contact" href="#contact" data-info="contact" aria-label="Contact"></a>
</main>

<dialog id="infoDialog" aria-labelledby="dlgTitle">
  <div class="dialog-head"><h2 id="dlgTitle"></h2></div>
  <div class="dialog-body" id="dlgBody"></div>
  <div class="dialog-actions"><button class="close-btn" id="closeDialog" type="button">Close</button></div>
</dialog>

<script>
const CONTACT='michaeljsavage80@outlook.com';
const INFO={
  suite:{title:'DSS and LDSS Suite',body:'<p>The current public home presents CPR GF DSS Pre-Review, Open Water, Atmospheric Science LDSS and eExecutor.ai DSS.</p><p class="status">The systems are at different stages of controlled development and release. Public launch routes are shown only after verification.</p>'},
  cpr:{title:'CPR GF DSS Pre-Review',body:'<p>Human-designed, AI-assisted manuscript pre-review.</p><p class="status">Information route active. Protected launch remains separate until its exact public route is verified.</p>'},
  water:{title:'Open Water',body:'<p>Learning and decision support for open-water environments.</p><p class="status">Information route active. The exact public hosted application route still requires verification before direct launch is shown.</p>'},
  atmos:{title:'Atmospheric Science LDSS',body:'<p>Atmospheric-science learning and decision support for progressive reasoning and environmental measurement.</p><p class="status">Information route active. The exact public hosted endpoint still requires verification before direct launch is shown.</p>'},
  exec:{title:'eExecutor.ai DSS',body:'<p>Governed decision support for real-world work execution, with human-controlled outward action.</p><p class="status">Information route active. The exact hosted launch destination still requires verification before direct launch is shown.</p>'},
  about:{title:'About Fusion Epoch',body:'<p>Fusion Epoch brings together Decision Support Systems and Learning Decision Support Systems for research, environmental measurement, education and professional work.</p><p>Each system is human-designed and AI-assisted, with human judgement retained in control.</p><p>Development is led by Professor Michael J Savage, Professor Emeritus, University of KwaZulu-Natal.</p>'},
  gateway:{title:'DSS Access Gateway',body:'<p>The DSS Access Gateway is the separate protection and administration layer for governed resources.</p><p class="status">A protected launch is shown as live only after the exact production route has been verified.</p>'},
  news:{title:'News and Updates',body:'<p>Fusion Epoch website development is continuing through controlled releases.</p><p><strong>Wits seminar: CPR Ground Floor</strong><br>Wednesday, 21 October 2026, 13:00 to 14:00.</p>'},
  docs:{title:'Documentation',body:'<p>Public documentation is exposed only after the exact released documents and routes have been verified.</p><p>System-specific public information is available through the four application cards.</p>'},
  support:{title:'Support',body:`<p>For questions about Fusion Epoch or a specific system, contact Professor Michael J Savage.</p><p><a class="contact-link" href="mailto:${CONTACT}">${CONTACT}</a></p>`},
  contact:{title:'Contact',body:`<p>Professor Michael J Savage<br>Professor Emeritus, University of KwaZulu-Natal</p><p><a class="contact-link" href="mailto:${CONTACT}">${CONTACT}</a></p>`}
};

const dlg=document.getElementById('infoDialog');
const ttl=document.getElementById('dlgTitle');
const bdy=document.getElementById('dlgBody');
const closeBtn=document.getElementById('closeDialog');
let lastTrigger=null;

function showInfo(key,trigger){
  const item=INFO[key];
  if(!item)return;
  lastTrigger=trigger||null;
  ttl.textContent=item.title;
  bdy.innerHTML=item.body;
  if(!dlg.open)dlg.showModal();
  closeBtn.focus();
}

function closeInfo(){
  if(dlg.open)dlg.close();
}

document.querySelectorAll('[data-info]').forEach(el=>{
  el.addEventListener('click',event=>{
    event.preventDefault();
    const hash=el.getAttribute('href');
    if(hash)history.replaceState(null,'',hash);
    showInfo(el.dataset.info,el);
  });
});

document.querySelectorAll('[data-action="home"]').forEach(el=>{
  el.addEventListener('click',event=>{
    event.preventDefault();
    history.replaceState(null,'','#home');
    window.scrollTo({top:0,behavior:'smooth'});
    const h=document.getElementById('homeConfirm');
    h.classList.remove('on');
    void h.offsetWidth;
    h.classList.add('on');
    window.setTimeout(()=>h.classList.remove('on'),700);
  });
});

closeBtn.addEventListener('click',closeInfo);
dlg.addEventListener('click',event=>{
  const box=dlg.getBoundingClientRect();
  const outside=event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom;
  if(outside)closeInfo();
});
dlg.addEventListener('close',()=>{
  if(lastTrigger){lastTrigger.focus();lastTrigger=null;}
});

const HASH_TO_INFO={
  '#suite':'suite','#about':'about','#gateway':'gateway','#news':'news','#documentation':'docs','#support':'support','#contact':'contact',
  '#cpr-gf':'cpr','#open-water':'water','#atmospheric-science':'atmos','#eexecutor':'exec'
};
window.addEventListener('DOMContentLoaded',()=>{
  const key=HASH_TO_INFO[window.location.hash];
  if(key)showInfo(key,null);
});
</script>
</body>
</html>
