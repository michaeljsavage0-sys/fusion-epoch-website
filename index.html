<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fusion Epoch</title>
  <style>
    :root { --bg:#020817; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); }
    body { font-family:Arial, Helvetica, sans-serif; color:white; }
    .stage { position:relative; max-width:1280px; margin:0 auto; background:var(--bg); }
    .stage img { display:block; width:100%; height:auto; }
    .hotspot { position:absolute; display:block; border-radius:10px; }
    .hotspot:focus-visible { outline:3px solid #35c4ff; outline-offset:2px; }
    .cpr   { left:15.0%; top:42.4%; width:19.7%; height:34.8%; }
    .water { left:35.5%; top:42.4%; width:19.4%; height:34.8%; }
    .atmos { left:55.7%; top:42.4%; width:19.8%; height:34.8%; }
    .exec  { left:76.3%; top:42.4%; width:20.2%; height:34.8%; }
  </style>
</head>
<body>
  <main class="stage" aria-label="Fusion Epoch landing page">
    <img src="master_visual.jpg" alt="Fusion Epoch visual master">
    <a class="hotspot cpr" href="#cpr-gf" aria-label="CPR GF DSS Pre-Review"></a>
    <a class="hotspot water" href="#open-water" aria-label="Open Water LPDSS"></a>
    <a class="hotspot atmos" href="#atmospheric-science" aria-label="Atmospheric Science LDSS"></a>
    <a class="hotspot exec" href="#eexecutor" aria-label="eExecutor.ai DSS"></a>
  </main>

  <section id="cpr-gf" hidden></section>
  <section id="open-water" hidden></section>
  <section id="atmospheric-science" hidden></section>
  <section id="eexecutor" hidden></section>
</body>
</html>
